name: Validate Pinocchio V2 story, voices and S02/S03 design
on:
  push:
    branches:
      - s01/full-story-production
    paths:
      - "AGENTS.md"
      - "docs/series_v2/**"
      - "assets/voice_refs/**"
      - "scenes/S02/**"
      - "scenes/S03/**"
      - "scripts/validate_series_v2.py"
      - "scripts/validate_s02_design.py"
      - "scripts/validate_s03_design.py"
      - "scripts/s02_approved_voice_tts.py"
      - "scripts/s03_approved_voice_tts.py"
      - ".github/workflows/validate-series-v2.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/series_v2/**"
      - "assets/voice_refs/**"
      - "scenes/S02/**"
      - "scenes/S03/**"
      - "scripts/validate_series_v2.py"
      - "scripts/validate_s02_design.py"
      - "scripts/validate_s03_design.py"
      - "scripts/s02_approved_voice_tts.py"
      - "scripts/s03_approved_voice_tts.py"
      - ".github/workflows/validate-series-v2.yml"
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify V1.1 sources and scene policy
        run: python3 scripts/validate_series_v2.py
      - name: Verify ChatGPT S02 design
        run: python3 scripts/validate_s02_design.py
      - name: Verify ChatGPT S03 design and S02 schema compatibility
        run: python3 scripts/validate_s03_design.py
      - name: Verify approved V6 reference voice MP3s and S02 inputs
        run: python3 scripts/s02_approved_voice_tts.py
      - name: Verify approved V6 reference voice MP3s and S03 inputs
        run: python3 scripts/s03_approved_voice_tts.py
